<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhishGuard AI - URL check</title>
<style>
  :root { --bg:#0f172a; --card:#1e293b; --line:#334155; --txt:#e2e8f0; --mut:#94a3b8;
          --ok:#10b981; --warn:#f59e0b; --bad:#ef4444; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font-family:system-ui,Segoe UI,Arial,sans-serif; padding:24px; }
  .wrap { max-width:720px; margin:0 auto; }
  h1 { margin:0 0 4px; font-size:1.6rem; }
  p.sub { margin:0 0 20px; color:var(--mut); }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:20px; margin-bottom:16px; }
  .row { display:flex; gap:8px; }
  input { flex:1; padding:12px; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--txt); font-size:1rem; min-width:0; }
  button { padding:12px 18px; border:0; border-radius:8px; background:var(--ok); color:#04130d; font-weight:600; cursor:pointer; font-size:1rem; }
  button.ghost { background:transparent; color:var(--mut); border:1px solid var(--line); padding:6px 10px; font-weight:400; font-size:.85rem; }
  .ex { margin-top:10px; display:flex; gap:8px; flex-wrap:wrap; }
  .badge { display:inline-block; padding:4px 12px; border-radius:999px; font-weight:700; font-size:.9rem; }
  .NOT_SCORED { background:#334155; color:#e2e8f0; } .PHISHING { background:#7f1d1d; color:#fecaca; } .SUSPICIOUS { background:#78350f; color:#fde68a; } .LIKELY_SAFE { background:#064e3b; color:#a7f3d0; }
  .bar { height:10px; background:var(--bg); border-radius:999px; overflow:hidden; margin:12px 0 4px; }
  .bar > div { height:100%; background:var(--ok); transition:width .3s; }
  .mut { color:var(--mut); font-size:.85rem; }
  ul { margin:8px 0 0; padding-left:20px; } li { margin:4px 0; }
  .err { color:#fca5a5; }
  code { background:var(--bg); padding:2px 6px; border-radius:4px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>PhishGuard AI</h1>
  <p class="sub">Paste a URL. The score comes from a trained model, not from fixed values.</p>

  <div class="card">
    <div class="row">
      <input id="url" type="text" placeholder="https://example.com/login" autocomplete="off">
      <button id="go">Check</button>
    </div>
    <div class="ex">
      <button class="ghost" data-u="https://www.wikipedia.org">wikipedia.org</button>
      <button class="ghost" data-u="http://secure-paypal-login-48213.xyz/verify">secure-paypal-login-48213.xyz</button>
      <button class="ghost" data-u="http://192.168.4.77/account/update">192.168.4.77</button>
    </div>
  </div>

  <div id="out" class="card" style="display:none"></div>
</div>

<script>
  const out = document.getElementById('out');
  const input = document.getElementById('url');

  function esc(s) { return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  async function check() {
    const url = input.value.trim();
    if (!url) return;
    out.style.display = 'block';
    out.innerHTML = '<span class="mut">Checking...</span>';
    try {
      const res = await fetch('/api/v1/detect', {
        method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url})
      });
      const d = await res.json();
      if (!res.ok) { out.innerHTML = '<span class="err">' + esc(d.detail || 'Request failed') + '</span>'; return; }
      const m = d.model && d.model.test_metrics;
      if (d.verdict === 'NOT_SCORED') {
        out.innerHTML = '<span class="badge NOT_SCORED">NOT SCORED</span> <span class="mut">host: <code>' + esc(d.host) + '</code></span>' +
          '<p>This site lives on a shared hosting platform (<code>' + esc(d.scored_domain) + '</code>). The platform\'s domain says nothing about this specific site, so the model does not give a score.</p>';
        return;
      }
      const ind = d.indicators.length
        ? '<ul>' + d.indicators.map(i => '<li>' + esc(i) + '</li>').join('') + '</ul>'
        : '<div class="mut">No notable indicators.</div>';
      out.innerHTML =
        '<span class="badge ' + esc(d.verdict) + '">' + esc(d.verdict.replace('_',' ')) + '</span> ' +
        '<span class="mut">host: <code>' + esc(d.host) + '</code></span>' +
        '<div class="bar"><div style="width:' + Math.min(100, d.risk_score) + '%"></div></div>' +
        '<div>Risk score: <b>' + d.risk_score + '</b> / 100 <span class="mut">(PHISHING from ' + (d.threshold*100).toFixed(0) + ', SUSPICIOUS from ' + ((d.threshold_review ?? d.threshold)*100).toFixed(0) + ')</span></div>' +
        '<div class="mut">Scored domain: <code>' + esc(d.scored_domain) + '</code> (subdomain and path are not scored)</div>' +
        '<h4 style="margin:16px 0 0">Indicators <span class="mut">(explanation only, not part of the score)</span></h4>' + ind +
        (m ? '<p class="mut" style="margin-top:16px">Model: ' + esc(d.model.model_name) + '. On held-out domains the PHISHING verdict catches ' + (m.recall*100).toFixed(0) + '% of phishing domains with a ' + (m.fpr*100).toFixed(1) + '% false-positive rate. Treat it as a risk signal, not a final verdict.</p>' : '');
    } catch (e) {
      out.innerHTML = '<span class="err">Cannot reach the server: ' + esc(e) + '</span>';
    }
  }

  document.getElementById('go').addEventListener('click', check);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') check(); });
  document.querySelectorAll('[data-u]').forEach(b => b.addEventListener('click', () => { input.value = b.dataset.u; check(); }));
</script>
</body>
</html>
