apiVersion: apps/v1
kind: Deployment
metadata:
  name: phishguard-sovereign-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: phishguard-core
  template:
    metadata:
      labels:
        app: phishguard-core
    spec:
      containers:
      - name: phishguard
        image: phishguard-ai:v54
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: phishguard-service
spec:
  type: NodePort
  selector:
    app: phishguard-core
  ports:
    - port: 8000
      targetPort: 8000
      nodePort: 30000