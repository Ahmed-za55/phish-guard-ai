name: CI

on:
  push:
    branches: [ "main", "private-mode" ]
  pull_request:
    branches: [ "main", "private-mode" ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          if [ -f backend/requirements-real.txt ]; then pip install -r backend/requirements-real.txt; fi
          pip install pytest
      - name: Run tests
        run: |
          cd backend
          python -m pytest -q